name: promote
on:
  workflow_dispatch:
    inputs:
      name:
        description: 사이트가 읽게 할 결과 이름 (train 실행 때 넣은 이름. 비웠다면 run-번호)
        required: true
permissions:
  contents: write
concurrency:
  group: promote
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 활성 모델로 바꾸기
        shell: bash
        env:
          NAME_IN: ${{ inputs.name }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_REPO }}
        run: |
          NAME="$NAME_IN"
          if [[ ! "$NAME" =~ ^[A-Za-z0-9._-]+$ ]] || [ "$NAME" = "." ] || [ "$NAME" = ".." ]; then
            echo "결과 이름은 영문/숫자/._- 만 쓸 수 있어요: '$NAME'"; exit 1
          fi
          [ -n "$HF_TOKEN" ] && [ -n "$HF_REPO" ] || { echo "HF_TOKEN 시크릿과 HF_REPO 변수를 먼저 등록하세요"; exit 1; }
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          pip install -q huggingface_hub
          python3 - <<'PY'
          import filecmp, json, os, sys
          from huggingface_hub import HfApi, hf_hub_download
          from huggingface_hub.utils import EntryNotFoundError

          token, repo = os.environ["HF_TOKEN"], os.environ["HF_REPO"]
          name, run = os.environ["NAME"], os.environ["GITHUB_RUN_NUMBER"]
          api = HfApi(token=token)

          def get(path):
              return hf_hub_download(repo_id=repo, filename=path, repo_type="model", token=token, force_download=True)

          try:
              new = get(f"runs/{name}/model_free.json")
          except EntryNotFoundError:
              sys.exit(f"Hugging Face에 runs/{name}/model_free.json 이(가) 없어요. 이름을 확인하세요")

          o = json.load(open(new, encoding="utf-8"))
          if o.get("kind") != "free-v1" or "tok" not in o or "lm" not in o:
              sys.exit("자유 생성 모델(free-v1) 형식이 아니라서 올리지 않아요")
          info = f"steps={o.get('steps')} loss={o.get('loss')} made={o.get('made')}"
          print("올릴 모델:", name, info)

          cur = None
          try:
              cur = get("model_free.json")
          except EntryNotFoundError:
              print("지금 활성 모델이 없어요 (백업 없이 올려요)")

          if cur and filecmp.cmp(cur, new, shallow=False):
              result = "이미 이 모델이 활성이에요. 바꿀 게 없어요"
          else:
              if cur:
                  backup = f"previous/before-{name}-{run}/model_free.json"
                  api.upload_file(path_or_fileobj=cur, path_in_repo=backup, repo_id=repo, repo_type="model",
                                  commit_message=f"backup before {name}")
                  print("이전 활성 모델 백업:", backup)
              api.upload_file(path_or_fileobj=new, path_in_repo="model_free.json", repo_id=repo, repo_type="model",
                              commit_message=f"activate: {name}")
              result = "활성 모델 교체 완료"
          print(result + ":", name)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a", encoding="utf-8") as f:
              f.write(f"### 활성 모델: {name}\n{result}\n\n`{info}`\n")
          PY

      # 어느 실행이 활성인지 저장소에도 남긴다 (모델 파일은 Hugging Face에 있음)
      - name: 기록 커밋
        shell: bash
        run: |
          mkdir -p train_data
          {
            echo "name=$NAME"
            echo "promoted=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -f "train_data/runs/$NAME/args.txt" ]; then echo "args=$(cat "train_data/runs/$NAME/args.txt")"; fi
          } > train_data/ACTIVE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add train_data/ACTIVE.txt
          if git diff --cached --quiet; then echo "기록할 변경이 없어요"; exit 0; fi
          git commit -m "promote: $NAME"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "푸시 재시도 ($i/3)"; sleep 5
          done
          echo "푸시 실패 - 활성 모델은 이미 바뀌었어요"; exit 1
