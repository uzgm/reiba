<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLM Brain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>SLM Brain</h1>
  <p id="stat">brain 로딩 중…</p>
  <div class="tools">
    <button class="btn" id="pickDir" type="button">brain 폴더 불러오기</button>
    <button class="btn" id="pickFiles" type="button">JSON 파일 추가</button>
    <button class="btn" id="reset" type="button">서버 brain으로 초기화</button>
  </div>
  <details><summary>brain 폴더 구조</summary><ul id="tree"></ul></details>
  <details><summary>JSON 형식</summary><pre>{
  "topic": "math",
  "entries": [
    {
      "id": "add",
      "tags": ["덧셈", "더하기"],
      "patterns": ["덧셈이 뭐야"],
      "answer": "덧셈은 두 수를 합치는 연산이야."
    }
  ]
}</pre></details>
</header>
<div id="chat" aria-live="polite"></div>
<form id="f" autocomplete="off">
  <input type="text" id="q" placeholder="질문을 입력하세요 (예: 소수가 뭐야, 12*(3+4))" aria-label="질문">
  <button id="send" type="submit">보내기</button>
</form>
<input type="file" id="dirIn" webkitdirectory multiple hidden>
<input type="file" id="fileIn" accept=".json,application/json" multiple hidden>

<script src="app.js"></script>
</body>
</html>
