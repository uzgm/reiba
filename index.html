<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reiba</title>
<style>
  :root {
    --bg: #e9eef5;
    --ink: #14213d;
    --muted: #4a5873;
    --btn-bg: #14213d;
    --btn-ink: #ffffff;
    --line: #c3cde0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101828;
      --ink: #eaf0fb;
      --muted: #9fb0cf;
      --btn-bg: #eaf0fb;
      --btn-ink: #101828;
      --line: #2a3a5c;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.6;
    display: flex;
    align-items: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  main { width: 100%; max-width: 440px; margin: 0 auto; }
  h1 {
    font-size: clamp(2.6rem, 14vw, 4.2rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin: 0 0 20px;
    font-weight: 800;
  }
  p { margin: 0 0 14px; color: var(--muted); max-width: 34em; }
  a.open {
    display: block;
    margin: 28px 0 24px;
    padding: 18px 20px;
    background: var(--btn-bg);
    color: var(--btn-ink);
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    border-radius: 10px;
  }
  a.open:focus-visible { outline: 3px solid var(--muted); outline-offset: 3px; }
  .note { border-top: 1px solid var(--line); padding-top: 16px; font-size: 0.92rem; }
</style>
</head>
<body>
<main>
  <h1>Reiba</h1>
  <p>직접 학습시킨 모델과 바로 대화할 수 있어요. 아래 버튼을 누르면 채팅 화면이 열립니다.</p>
  <a class="open" href="https://huggingface.co/spaces/Uzgm/reiba">채팅 열기</a>
  <div class="note">
    <p>Hugging Face에 로그인한 상태로 열면 하루 사용 한도가 더 넉넉해요. 로그인하지 않아도 쓸 수 있어요.</p>
    <p>처음 열 때는 서버를 깨우느라 1~2분 걸릴 수 있어요.</p>
  </div>
</main>
</body>
</html>
