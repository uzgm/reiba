<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny LLM 2</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f2;--surface:#fff;--ink:#17201b;--muted:#66726a;--line:#d9dfd9;--accent:#1f4d3a;--on:#f3f5f2;--chip:#e6ece7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--surface:#18211c;--ink:#e6ede8;--muted:#8d9a92;--line:#2a362f;--accent:#6fcf9f;--on:#0f1512;--chip:#223028}}
:root[data-theme="dark"]{--bg:#0f1512;--surface:#18211c;--ink:#e6ede8;--muted:#8d9a92;--line:#2a362f;--accent:#6fcf9f;--on:#0f1512;--chip:#223028}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
h1{font-size:17px;margin:0}
#stat{margin:2px 0 4px;color:var(--muted);font-size:12.5px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:13px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:6px 10px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details{font-size:13px;color:var(--muted)}summary{cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all}
.u{align-self:flex-end;background:var(--accent);color:var(--on);border-bottom-right-radius:4px}
.b{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.meta{display:block;margin-top:6px;font-size:11.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{font-size:12.5px;padding:5px 10px;border-radius:999px}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#send{background:var(--accent);color:var(--on);border:0;font-weight:700;padding:0 16px;font-size:14px}
progress{width:100%;height:8px;margin-top:8px;accent-color:var(--accent)}
select{font:inherit;font-size:13px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:6px 10px}
</style>
</head>
<body>
<header>
  <h1>Tiny LLM 2</h1>
  <div id="stat">불러오는 중…</div>
  <details><summary>학습 · 관리</summary>
    <progress id="bar" value="0" max="1"></progress>
    <div class="row">
      <button id="train" type="button">브라우저에서 학습</button>
      <select id="steps" aria-label="학습 횟수"><option value="800">800 step</option><option value="1500" selected>1500 step</option><option value="3000">3000 step</option><option value="6000">6000 step</option></select>
      <button id="exp" type="button" disabled>model.json 내보내기</button>
    </div>
    <div class="row">
      <select id="mode" aria-label="추론 답변 방식" disabled><option value="tool">추론: 도구(정확)</option><option value="nn">추론: 신경망(자유 생성)</option><option value="both">추론: 둘 다 비교</option></select>
      <span id="freeStat" style="font-size:12px;color:var(--muted);align-self:center">model_free.json 없음 · 추론은 도구가 답해요</span>
    </div>
    <div class="row">
      <button id="reload" type="button">data 다시 읽기</button>
      <button id="dir" type="button">폴더 추가</button>
      <button id="files" type="button">JSON 추가</button>
      <button id="clr" type="button">기억 지우기</button>
    </div>
  </details>
</header>
<div id="chat" aria-live="polite"></div>
<form id="f" autocomplete="off">
  <input type="text" id="q" placeholder="메시지를 입력하세요" disabled aria-label="질문">
  <button id="send" type="submit">보내기</button>
</form>
<input type="file" id="dirIn" webkitdirectory multiple hidden>
<input type="file" id="fileIn" accept=".json,application/json" multiple hidden>

<script src="lm.js"></script>
<script>
const $ = id => document.getElementById(id), chat = $("chat"), sleep = ms => new Promise(r => setTimeout(r, ms));
const { Bot, fit, tools, mem, Tok, Fast } = LMKit;
let BRAIN = {}, model = null, bot = null, busy = false;
let free = null, freeGen = null, mode = "tool", score = { n: 0, ok: 0, v: 0, ex: 0 }; // free: 자유 생성 모델(model_free.json), score: 도구(교사)와 비교한 누적 결과

async function getJSON(name) { // 한 파일로 묶인 배포본이면 안에서, 아니면 같은 폴더에서 읽는다
  const el = document.getElementById("inline-" + name); if (el) return JSON.parse(el.textContent);
  const r = await fetch(name, { cache: "no-store" }); if (!r.ok) throw 0; return r.json();
}
try { Object.assign(mem, JSON.parse(localStorage.getItem("tl-mem") || "{}")); } catch {}
LMKit.onMem = m => { try { localStorage.setItem("tl-mem", JSON.stringify(m)); } catch {} };

/* ---------- 자유 생성: 답 전체를 토큰 하나씩 직접 써 내려간다 (train_free.js의 makeGen과 같음. 순수 JS + KV 캐시) ---------- */
function makeFree(o) {
  const tok = Tok.fromJSON(o.tok), fast = new Fast(o.lm), T = o.lm.cfg.T, RESERVE = 48;
  return q => {
    const t0 = performance.now(); let qq = q.trim(), ids;
    while ((ids = tok.encode("Q:" + qq + "\nA:")).length > T - RESERVE && qq.length > 1) qq = qq.slice(1); // 너무 길면 앞쪽을 자른다(질문은 맨 끝에 있다)
    const st = fast.state(); let lg; for (const id of ids) lg = fast.step(st, id);
    const out = [];
    while (out.length < 160 && st.n < T) {
      lg[1] = -Infinity; let b = 0; for (let i = 1; i < lg.length; i++) if (lg[i] > lg[b]) b = i; // <unk> 금지, 가장 높은 점수(greedy)
      if (b === 0) break; out.push(b); if (st.n >= T) break; lg = fast.step(st, b);
    }
    return { text: tok.decode(out), n: out.length, ms: performance.now() - t0 };
  };
}
const lastLine = a => String(a).split("\n").pop();
const headKind = a => { const h = String(a).split("\n")[0]; return /^응/.test(h) ? "yes" : /^아니야/.test(h) ? "no" : /^(내가 아는 것만|알려준 비교만으로는)/.test(h) ? "unk" : /^\S+!/.test(h) ? "top:" + h.split("!")[0] : "?"; }; // 답의 ‘결론’만 뽑아 비교한다

function bubble(cls, text) {
  const e = document.createElement("div"); e.className = "m " + cls;
  const t = document.createElement("span"); t.textContent = text || ""; e.appendChild(t);
  chat.appendChild(e); chat.scrollTop = chat.scrollHeight; return e;
}
function chips(el, list) {
  if (!list || !list.length) return;
  const w = document.createElement("div"); w.className = "chips";
  for (const c of list) { const b = document.createElement("button"); b.type = "button"; b.textContent = c; b.onclick = () => ask(c); w.appendChild(b); }
  el.appendChild(w);
}
/* ---------- data/ 폴더 자동 학습 (data/en/eng.json 처럼 하위 폴더도 끝까지 탐색) ---------- */
const CFG = { dir: "data", repo: "", branch: "", max: 300, maxBytes: 3e6 }; // repo는 "내아이디/레포이름". 비워두면 github.io 주소에서 자동 감지
{ const q = new URLSearchParams(location.search); CFG.repo = q.get("repo") || CFG.repo; CFG.branch = q.get("branch") || CFG.branch; }
const ghRepo = () => {
  if (CFG.repo) return CFG.repo;
  const m = location.hostname.match(/^([^.]+)\.github\.io$/); if (!m) return "";
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return m[1] + "/" + (seg && !/\.html?$/i.test(seg) ? seg : m[1] + ".github.io");
};
const isJSON = p => /\.json$/i.test(p), enc = p => p.split("/").map(encodeURIComponent).join("/");
const str = v => typeof v === "string" || typeof v === "number" ? String(v).trim() : "";
const list = v => (Array.isArray(v) ? v : v == null ? [] : [v]).map(str).filter(Boolean);
const QK = ["patterns", "pattern", "questions", "question", "q", "prompt", "input", "질문"], AK = ["answer", "answers", "a", "response", "reply", "output", "text", "답", "답변"];

function toEntries(d, n = 0) { // 여러 JSON 모양을 {patterns, answer, tags} 항목으로 통일
  if (d == null || n > 5) return [];
  if (Array.isArray(d)) return d.flatMap(x => toEntries(x, n + 1));
  if (typeof d !== "object") return [];
  const get = ks => { for (const k of ks) if (d[k] != null) return d[k]; };
  const a = get(AK), tags = list(get(["tags", "tag", "keywords", "키워드"]));
  if (a != null) { // 항목 하나: 질문(patterns) + 답. 질문이 없으면 tags, 그것도 없으면 id를 질문으로 쓴다
    const pats = list(get(QK)), P = pats.length ? pats : tags.length ? tags : list(d.id);
    return P.length ? list(a).map(answer => ({ id: d.id, tags, patterns: P, answer })) : [];
  }
  for (const k of ["entries", "data", "items", "faq", "qa"]) if (Array.isArray(d[k])) return toEntries(d[k], n + 1);
  const out = []; // {"질문": "답"} 또는 {"파일경로": {entries:[…]}}
  for (const [k, v] of Object.entries(d)) {
    if (/^(topic|version|lang|\$schema|description)$/.test(k)) continue;
    if (typeof v === "string") out.push({ tags: [k], patterns: [k], answer: v });
    else if (v && typeof v === "object") out.push(...toEntries(v, n + 1));
  }
  return out;
}

async function listData() { // data 폴더 안의 JSON 경로 목록 (하위 폴더 포함)
  const D = CFG.dir + "/";
  try { // 1) data/index.json 목록 파일 (["en/eng.json", …] 또는 {"files":[…]})
    const r = await fetch(D + "index.json", { cache: "no-store" });
    if (r.ok) { const j = await r.json(), a = Array.isArray(j) ? j : j && j.files; if (Array.isArray(a) && a.every(x => typeof x === "string")) return a.map(p => p.startsWith(D) ? p : D + p.replace(/^\.?\//, "")).filter(isJSON); }
  } catch {}
  const repo = ghRepo(); // 2) GitHub API로 레포 전체 트리에서 data/** 찾기
  if (repo) for (const br of [...new Set([CFG.branch, "HEAD", "main", "master"].filter(Boolean))]) {
    try {
      const r = await fetch(`https://api.github.com/repos/${repo}/git/trees/${br}?recursive=1`); if (!r.ok) continue;
      const L = ((await r.json()).tree || []).filter(t => t.type === "blob" && t.path.startsWith(D) && isJSON(t.path) && (t.size || 0) < CFG.maxBytes).map(t => t.path);
      if (L.length) { CFG.branch = br; return L; }
    } catch {}
  }
  const out = []; // 3) 로컬 서버의 폴더 목록 페이지(python -m http.server 등)
  async function walk(dir, depth) {
    if (depth > 5 || out.length >= CFG.max) return;
    let h, base = new URL(dir, location.href);
    try { const r = await fetch(dir, { cache: "no-store" }); if (!r.ok || !/html/.test(r.headers.get("content-type") || "")) return; h = await r.text(); } catch { return; }
    for (const m of h.matchAll(/href="([^"#?]+)"/g)) {
      let u; try { u = new URL(m[1], base); } catch { continue; }
      if (u.origin !== base.origin || !u.pathname.startsWith(base.pathname) || u.pathname === base.pathname) continue;
      const rel = decodeURIComponent(u.pathname.slice(base.pathname.length));
      if (rel.endsWith("/")) await walk(dir + rel, depth + 1); else if (isJSON(rel)) out.push(dir + rel);
    }
  }
  await walk(D, 0); return out;
}
async function fetchData(p) { // 같은 사이트에서 먼저, 안 되면 raw.githubusercontent.com에서
  const get = async u => { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw 0; return r.text(); };
  try { return await get(enc(p)); } catch { const repo = ghRepo(); if (!repo) throw 0; return get(`https://raw.githubusercontent.com/${repo}/${CFG.branch || "HEAD"}/${enc(p)}`); }
}
async function loadData() { // → { paths: 찾은 파일 수, files: [[경로, {entries}], …] } (경로순 정렬: 학습 때와 같은 순서를 보장)
  const paths = [...new Set(await listData())].sort().slice(0, CFG.max), files = [];
  await Promise.all(paths.map(async p => {
    try { const es = toEntries(JSON.parse((await fetchData(p)).replace(/^\uFEFF/, ""))); if (es.length) files.push([p, { topic: p.split("/")[1] || "", entries: es }]); } catch {}
  }));
  return { paths: paths.length, files: files.sort((a, b) => a[0] < b[0] ? -1 : 1) };
}
const dataMsg = D => D.files.length ? `data 폴더에서 JSON ${D.files.length}개를 읽었어.` : D.paths ? `data 폴더에서 JSON ${D.paths}개를 찾았지만 지식 형식이 아니라서 건너뛰었어.` : "";

function refresh() {
  bot = new Bot(BRAIN, model); if (model && !bot.fast) model = null;
  const n = Object.keys(BRAIN).length, nd = Object.keys(BRAIN).filter(k => k.startsWith(CFG.dir + "/")).length;
  const st = !model ? "모델 없음 · 검색으로만 답해요" : bot.stale ? "brain이 바뀌었어요 · 재학습 권장(새 지식은 검색으로 먼저 답해요)" : `파라미터 ${model.params.toLocaleString()}개 · loss ${model.loss.toFixed(3)}`;
  $("stat").textContent = `파일 ${n}개(data ${nd}개) · 지식 ${bot.P.ans.length - 1}개 · ${st}`;
  $("q").disabled = false; $("exp").disabled = !model;
}

async function ask(q) {
  q = q.trim(); if (!q || busy || !bot) return; busy = true; bubble("u", q);
  const t0 = performance.now(), t = tools(q); let text, meta, sug;
  if (t) {
    text = t.a; sug = t.chips; meta = `도구: ${t.src} · ${(performance.now() - t0).toFixed(1)}ms`;
    if (t.src === "추론" && freeGen && mode !== "tool") { // 도구(교사)는 정답 확인용으로 항상 돌리고, 신경망 답과 비교한다
      const g = freeGen(q), exact = g.text === t.a, vOk = headKind(g.text) === headKind(t.a), same = vOk && lastLine(g.text) === lastLine(t.a); // same: 판정과 ⇒ 결론 줄까지 같다(우연히 ‘응’만 맞은 건 제외)
      score.n++; if (same) score.ok++; if (vOk) score.v++; if (exact) score.ex++;
      const tag = exact ? "도구와 완전 일치" : same ? "결론까지 일치(근거 줄 표현만 다름)" : vOk ? "판정만 일치(내용은 다름)" : "도구와 다름";
      meta = `신경망 자유 생성 ${g.n}토큰 · ${g.ms.toFixed(0)}ms · ${tag} · 누적 결론까지 일치 ${score.ok}/${score.n} (판정만 맞은 것 포함 ${score.v}/${score.n}, 완전 ${score.ex})`;
      text = mode === "nn" ? (g.text || "(신경망이 빈 답을 냈어)") : `신경망:\n${g.text || "(빈 답)"}\n\n도구(정확):\n${t.a}`;
      sug = null;
    }
  }
  else {
    const o = bot.reply(q); text = o.text; sug = o.unk ? o.sug : null;
    meta = o.n ? `신경망 ${o.n}토큰 · LM ${o.lm == null ? "-" : Math.round(o.lm * 100) + "%"} · 검색 ${Math.round(o.ret * 100)}% · ${o.ms.toFixed(1)}ms` : `검색 · ${o.ms.toFixed(1)}ms`;
  }
  const el = bubble("b", ""), sp = el.firstChild, step = Math.max(1, Math.ceil(text.length / 40));
  for (let i = 0; i < text.length; i += step) { sp.textContent = text.slice(0, i + step); chat.scrollTop = chat.scrollHeight; await sleep(10); }
  sp.textContent = text;
  const m = document.createElement("span"); m.className = "meta"; m.textContent = meta; el.appendChild(m);
  chips(el, sug); chat.scrollTop = chat.scrollHeight; busy = false;
}
$("f").addEventListener("submit", e => { e.preventDefault(); if (busy) return; const v = $("q").value; $("q").value = ""; ask(v); });

async function ensureTF() {
  if (!window.tf) await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  LMKit.setTF(window.tf);
}
$("train").onclick = async () => {
  if (busy) return; busy = true; $("train").disabled = true;
  try {
    $("stat").textContent = "학습 엔진(tf.js) 불러오는 중…"; await ensureTF();
    const steps = +$("steps").value, t0 = Date.now(); $("bar").max = steps;
    model = await fit(BRAIN, { steps }, (s, n, l) => { $("bar").value = s; $("stat").textContent = `학습 중 ${s}/${n} · loss ${l.toFixed(3)} · ${((Date.now() - t0) / 1000) | 0}초`; });
    refresh(); bubble("b", `학습 끝! loss ${model.loss.toFixed(3)}. 이제 신경망이 직접 답해. 계속 쓰려면 ‘model.json 내보내기’로 저장해서 사이트에 올려줘.`);
  } catch (e) { console.error(e); bubble("b", "학습에 실패했어. 네트워크(tf.js 불러오기)를 확인해줘."); refresh(); }
  busy = false; $("train").disabled = false;
};
$("exp").onclick = () => { if (!model) return; const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(model)], { type: "application/json" })); a.download = "model.json"; a.click(); };

async function loadFiles(list, replace) {
  const next = replace ? {} : { ...BRAIN }; let ok = 0;
  const add = (k, d) => { const es = toEntries(d); if (es.length) { next[k] = { entries: es }; ok++; } };
  for (const f of list) { if (!/\.json$/i.test(f.name)) continue; try { add(f.webkitRelativePath || "brain/" + f.name, JSON.parse((await f.text()).replace(/^\uFEFF/, ""))); } catch {} }
  if (ok) { BRAIN = next; refresh(); bubble("b", `JSON ${ok}개를 읽었어. 검색으로는 바로 답할 수 있고, 신경망까지 반영하려면 ‘브라우저에서 학습’을 눌러줘.`); }
  else bubble("b", "읽을 수 있는 JSON이 없어.");
}
$("dir").onclick = () => $("dirIn").click(); $("files").onclick = () => $("fileIn").click();
$("dirIn").onchange = e => { loadFiles([...e.target.files], false); e.target.value = ""; };
$("fileIn").onchange = e => { loadFiles([...e.target.files], false); e.target.value = ""; };
$("reload").onclick = async () => {
  if (busy) return; busy = true; $("stat").textContent = "data 폴더 읽는 중…";
  const D = await loadData().catch(() => ({ paths: 0, files: [] }));
  for (const k of Object.keys(BRAIN)) if (k.startsWith(CFG.dir + "/")) delete BRAIN[k];
  for (const [k, v] of D.files) BRAIN[k] = v;
  refresh(); bubble("b", (dataMsg(D) || "data 폴더에서 읽을 JSON을 못 찾았어.") + (D.files.length ? " 신경망까지 반영하려면 ‘브라우저에서 학습’을 눌러줘." : "")); busy = false;
};
$("mode").onchange = () => { mode = $("mode").value; score = { n: 0, ok: 0, v: 0, ex: 0 }; try { localStorage.setItem("tl-mode", mode); } catch {} };
$("clr").onclick = () => { for (const k of Object.keys(mem)) delete mem[k]; LMKit.onMem(mem); bubble("b", "기억(이름·가르친 문장)을 지웠어."); };

(async () => {
  try { BRAIN = await getJSON("brain.json"); } catch { BRAIN = {}; }
  try { model = await getJSON("model.json"); } catch { model = null; }
  try { const o = await getJSON("model_free.json"); if (o && o.kind === "free-v1") { freeGen = makeFree(o); free = o; } } catch { free = null; freeGen = null; }
  if (free) {

  }

  let D = { paths: 0, files: [] }; try { D = await loadData(); } catch {}
  for (const [k, v] of D.files) BRAIN[k] = v;
  refresh();
  const info = dataMsg(D) ? "\n\n" + dataMsg(D) + (!model || bot.stale ? " 신경망에도 반영하려면 ‘학습 · 관리’ → ‘브라우저에서 학습’을 눌러줘." : "") : "";
  chips(bubble("b", (model ? "안녕! 질문하면 작은 트랜스포머가 직접 답을 골라 말해. 계산이나 시간은 도구로 정확하게 처리하고, 문장을 가르쳐 주면 조사로 역할을 나눠서 추론도 해. 아래 예시를 눌러봐." : "model.json이 없어서 지금은 검색으로만 답해. ‘학습 · 관리’에서 학습시켜줘.") + info), ["소수가 뭐야", "97은 소수야?", "(12+8)×3÷4", "고양이는 동물이다. 동물은 생물이다. 고양이는 생물일까?", "영희보다 철수가 크다. 민수보다 영희가 크다. 누가 제일 커?", "새는 날 수 있다. 펭귄은 새다. 펭귄은 날 수 없다. 펭귄은 날 수 있어?", "비가 오면 땅이 젖는다. 비가 온다. 땅이 젖을까?"]);
