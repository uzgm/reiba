<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BAREA · 바레아</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1a1a26;--panel:#33333f;--ink:#f2f2f5;--muted:#a9a9b8;--blue:#4d80cc;--green:#4db34d;--purple:#994da6;--orange:#cc8033}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 12% 8%,#2c2c44 0,transparent 42%),radial-gradient(circle at 92% 92%,#33263f 0,transparent 42%),var(--bg);color:var(--ink);font:15px/1.55 "Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;display:flex;flex-direction:column;gap:10px;padding:10px 10px 10px}
.panel{background:var(--panel);border:2px solid var(--bc,var(--blue));border-radius:10px;box-shadow:0 4px 12px #0008}
.btn{--c:var(--blue);font:inherit;font-size:13px;color:#fff;background:var(--c);border:2px solid color-mix(in srgb,var(--c) 45%,white);border-radius:10px;box-shadow:0 3px 6px #0007;padding:7px 12px;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
@media(hover:hover){.btn:hover:not(:disabled){background:color-mix(in srgb,var(--c) 85%,white);transform:scale(1.035);box-shadow:0 4px 10px #0009}}
.btn:active:not(:disabled){transform:scale(.93);background:color-mix(in srgb,var(--c) 80%,black);box-shadow:0 1px 2px #0006}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffe9a6;outline-offset:2px}
.glow{position:fixed;pointer-events:none;border-radius:14px;background:rgba(255,235,165,.55);z-index:999}
header{padding:10px 14px 12px}
.top{display:flex;align-items:center;gap:10px}
h1{flex:1;margin:0;font-size:21px;text-align:center;text-shadow:0 0 6px #000,0 0 2px #000;color:#fff}
#menuBtn{--c:#454558;width:44px;height:40px;font-size:19px;padding:0}
h1 small{font-size:13px;font-weight:600;color:#ffd98a;margin-left:4px}
.sub{margin-top:2px;text-align:center;font-size:11px;letter-spacing:.18em;color:#ffd98a}
#stat{margin:6px 2px 0;text-align:center;color:var(--muted);font-size:12.5px}
#chat{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px;--bc:var(--green);min-height:0}
.m{max-width:88%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all;box-shadow:0 2px 6px #0006}
.u{align-self:flex-end;background:var(--green);color:#fff;border:2px solid #9be09b;border-bottom-right-radius:4px}
.b{align-self:flex-start;background:#26262f;border:2px solid #5a5a70;border-bottom-left-radius:4px}
.meta{display:block;margin-top:6px;font-size:11.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chips .btn{--c:#6a5aa8;font-size:12.5px;padding:5px 11px;border-radius:999px}
.bar{--bc:var(--purple);position:relative;padding:8px}
form{display:flex;gap:8px;align-items:center;margin:0}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:2px solid #5a5a70;background:#1f1f29;color:var(--ink)}
#mdl{--c:#454558;white-space:nowrap;padding:8px 10px}
#send{--c:var(--green);font-weight:700;font-size:14px;padding:9px 14px}
#menu{position:absolute;left:8px;right:8px;bottom:calc(100% + 8px);padding:8px;--bc:var(--orange);display:none;z-index:20}
#menu.on{display:block}
.mi{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:transparent;border:2px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer}
.mi:hover:not(:disabled),.mi.sel{background:#42425a;border-color:#6d6d88}
.mi:disabled{opacity:.4;cursor:default}
.mi b{display:block;font-size:14px}.mi span{font-size:12px;color:var(--muted)}
#freeStat{margin:6px 6px 2px;font-size:12px;color:var(--muted)}
#adm{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
#adm.on{display:flex}
#adm .panel{--bc:var(--purple);width:min(460px,100%);padding:16px;display:flex;flex-direction:column;gap:12px}
.hd{display:flex;align-items:center;gap:8px}.hd h2{flex:1;margin:0;font-size:18px;color:#d98ae6}
.hd .btn{--c:#666680}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1;min-width:120px}
.row .g{--c:var(--green)}.row .o{--c:var(--orange)}.row .p{--c:#8a5aa8}.row .x{--c:#a84a4a}
select{font:inherit;font-size:13px;border-radius:10px;border:2px solid #5a5a70;background:#1f1f29;color:var(--ink);padding:7px 8px}
progress{width:100%;height:10px;accent-color:var(--green)}
hr{border:0;border-top:1px solid #4a4a5c;margin:0}
</style>
</head>
<body>
<header class="panel">
  <div class="top"><span style="width:44px"></span><h1>🍞 BAREA <small>바레아</small></h1><button id="menuBtn" class="btn" type="button" aria-label="학습 · 관리">☰</button></div>
  <div class="sub">BAGERU RAPID ACARIUS</div>
  <div id="stat">불러오는 중…</div>
</header>
<div id="chat" class="panel" aria-live="polite"></div>
<div class="bar panel">
  <div id="menu" class="panel" role="menu"><div id="items"></div><div id="freeStat">model_free.json 없음 · 추론은 도구가 답해요</div></div>
  <form id="f" autocomplete="off">
    <button id="mdl" class="btn" type="button" aria-haspopup="menu">🛠 도구 ▾</button>
    <input type="text" id="q" placeholder="바레아에게 물어보세요" disabled aria-label="질문">
    <button id="send" class="btn" type="submit">보내기</button>
  </form>
</div>
<div id="adm"><div class="panel">
  <div class="hd"><h2>⚙ 학습 · 관리</h2><button id="admX" class="btn" type="button">닫기</button></div>
  <hr>
  <progress id="bar" value="0" max="1"></progress>
  <div class="row">
    <button id="train" class="btn g" type="button">🔥 브라우저에서 학습</button>
    <select id="steps" aria-label="학습 횟수"><option value="800">800 step</option><option value="1500" selected>1500 step</option><option value="3000">3000 step</option><option value="6000">6000 step</option></select>
  </div>
  <div class="row"><button id="exp" class="btn o" type="button" disabled>💾 model.json 내보내기</button></div>
  <hr>
  <div class="row">
    <button id="reload" class="btn" type="button">🔄 data 다시 읽기</button>
    <button id="dir" class="btn p" type="button">📁 폴더 추가</button>
    <button id="files" class="btn p" type="button">📄 JSON 추가</button>
    <button id="clr" class="btn x" type="button">🧹 기억 지우기</button>
  </div>
</div></div>
<input type="file" id="dirIn" webkitdirectory multiple hidden>
<input type="file" id="fileIn" accept=".json,application/json" multiple hidden>

<script src="lm.js"></script>
<script>
const $ = id => document.getElementById(id), chat = $("chat"), sleep = ms => new Promise(r => setTimeout(r, ms));
const { Bot, fit, tools, mem, Tok, Fast } = LMKit;
let BRAIN = {}, model = null, bot = null, busy = false;
let free = null, freeGen = null, mode = "tool", score = { n: 0, ok: 0, v: 0, ex: 0 };

/* ---------- 버튼 이펙트 (메인 메뉴 스타일: 클릭 글로우 + 놓을 때 바운스) ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest(".btn"); if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), g = document.createElement("div"); g.className = "glow";
  Object.assign(g.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  document.body.appendChild(g);
  g.animate([{ transform: "scale(1)", opacity: .55 }, { transform: "scale(1.55)", opacity: 0 }], { duration: 400, easing: "ease-out" }).onfinish = () => g.remove();
}, true);
document.addEventListener("pointerup", e => {
  const b = e.target.closest(".btn"); if (b && !b.disabled) b.animate([{ transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 170, easing: "ease-out" });
}, true);

async function getJSON(name) {
  const el = document.getElementById("inline-" + name); if (el) return JSON.parse(el.textContent);
  const r = await fetch(name, { cache: "no-store" }); if (!r.ok) throw 0; return r.json();
}
try { Object.assign(mem, JSON.parse(localStorage.getItem("tl-mem") || "{}")); } catch {}
LMKit.onMem = m => { try { localStorage.setItem("tl-mem", JSON.stringify(m)); } catch {} };

/* ---------- 자유 생성 (train_free.js의 makeGen과 같음) ---------- */
function makeFree(o) {
  const tok = Tok.fromJSON(o.tok), fast = new Fast(o.lm), T = o.lm.cfg.T, RESERVE = 48;
  return q => {
    const t0 = performance.now(); let qq = q.trim(), ids;
    while ((ids = tok.encode("Q:" + qq + "\nA:")).length > T - RESERVE && qq.length > 1) qq = qq.slice(1);
    const st = fast.state(); let lg; for (const id of ids) lg = fast.step(st, id);
    const out = [];
    while (out.length < 160 && st.n < T) {
      lg[1] = -Infinity; let b = 0; for (let i = 1; i < lg.length; i++) if (lg[i] > lg[b]) b = i;
      if (b === 0) break; out.push(b); if (st.n >= T) break; lg = fast.step(st, b);
    }
    return { text: tok.decode(out), n: out.length, ms: performance.now() - t0 };
  };
}
const lastLine = a => String(a).split("\n").pop();
const headKind = a => { const h = String(a).split("\n")[0]; return /^응/.test(h) ? "yes" : /^아니야/.test(h) ? "no" : /^(내가 아는 것만|알려준 비교만으로는)/.test(h) ? "unk" : /^\S+!/.test(h) ? "top:" + h.split("!")[0] : "?"; };

function bubble(cls, text) {
  const e = document.createElement("div"); e.className = "m " + cls;
  const t = document.createElement("span"); t.textContent = text || ""; e.appendChild(t);
  chat.appendChild(e); chat.scrollTop = chat.scrollHeight; return e;
}
function chips(el, list) {
  if (!list || !list.length) return;
  const w = document.createElement("div"); w.className = "chips";
  for (const c of list) { const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = c; b.onclick = () => ask(c); w.appendChild(b); }
  el.appendChild(w);
}

/* ---------- 하단 모델(추론 방식) 선택: 입력창 왼쪽 버튼 → 위로 펼쳐지는 목록 ---------- */
const MODES = { tool: ["🛠", "도구", "정확하게 계산하고 추론해요"], nn: ["🧠", "신경망", "model_free.json이 직접 써 내려가요"], both: ["⚖️", "둘 다 비교", "신경망 답과 도구 답을 나란히 보여줘요"] };
function renderMenu() {
  const box = $("items"); box.textContent = "";
  for (const k of Object.keys(MODES)) {
    const [ic, nm, ds] = MODES[k], b = document.createElement("button");
    b.type = "button"; b.className = "mi" + (k === mode ? " sel" : ""); b.disabled = k !== "tool" && !free;
    const t = document.createElement("b"); t.textContent = `${ic} ${nm}${k === mode ? " ✓" : ""}`;
    const s = document.createElement("span"); s.textContent = ds; b.append(t, s);
    b.onclick = () => { setMode(k); $("menu").classList.remove("on"); };
    box.appendChild(b);
  }
}
function setMode(m) {
  mode = MODES[m] && (m === "tool" || free) ? m : "tool"; score = { n: 0, ok: 0, v: 0, ex: 0 };
  try { localStorage.setItem("tl-mode", mode); } catch {}
  $("mdl").textContent = `${MODES[mode][0]} ${MODES[mode][1]} ▾`; renderMenu();
}
$("mdl").onclick = e => { e.stopPropagation(); renderMenu(); $("menu").classList.toggle("on"); };
document.addEventListener("click", e => { if (!e.target.closest("#menu") && !e.target.closest("#mdl")) $("menu").classList.remove("on"); });
$("menuBtn").onclick = () => $("adm").classList.add("on");
$("admX").onclick = () => $("adm").classList.remove("on");
$("adm").addEventListener("click", e => { if (e.target === $("adm")) $("adm").classList.remove("on"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("menu").classList.remove("on"); $("adm").classList.remove("on"); } });

/* ---------- data/ 폴더 자동 학습 ---------- */
const CFG = { dir: "data", repo: "", branch: "", max: 300, maxBytes: 3e6 };
{ const q = new URLSearchParams(location.search); CFG.repo = q.get("repo") || CFG.repo; CFG.branch = q.get("branch") || CFG.branch; }
const ghRepo = () => {
  if (CFG.repo) return CFG.repo;
  const m = location.hostname.match(/^([^.]+)\.github\.io$/); if (!m) return "";
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return m[1] + "/" + (seg && !/\.html?$/i.test(seg) ? seg : m[1] + ".github.io");
};
const isJSON = p => /\.json$/i.test(p), enc = p => p.split("/").map(encodeURIComponent).join("/");
const str = v => typeof v === "string" || typeof v === "number" ? String(v).trim() : "";
const list = v => (Array.isArray(v) ? v : v == null ? [] : [v]).map(str).filter(Boolean);
const QK = ["patterns", "pattern", "questions", "question", "q", "prompt", "input", "질문"], AK = ["answer", "answers", "a", "response", "reply", "output", "text", "답", "답변"];

function toEntries(d, n = 0) {
  if (d == null || n > 5) return [];
  if (Array.isArray(d)) return d.flatMap(x => toEntries(x, n + 1));
  if (typeof d !== "object") return [];
  const get = ks => { for (const k of ks) if (d[k] != null) return d[k]; };
  const a = get(AK), tags = list(get(["tags", "tag", "keywords", "키워드"]));
  if (a != null) {
    const pats = list(get(QK)), P = pats.length ? pats : tags.length ? tags : list(d.id);
    return P.length ? list(a).map(answer => ({ id: d.id, tags, patterns: P, answer })) : [];
  }
  for (const k of ["entries", "data", "items", "faq", "qa"]) if (Array.isArray(d[k])) return toEntries(d[k], n + 1);
  const out = [];
  for (const [k, v] of Object.entries(d)) {
    if (/^(topic|version|lang|\$schema|description)$/.test(k)) continue;
    if (typeof v === "string") out.push({ tags: [k], patterns: [k], answer: v });
    else if (v && typeof v === "object") out.push(...toEntries(v, n + 1));
  }
  return out;
}

async function listData() {
  const D = CFG.dir + "/";
  try {
    const r = await fetch(D + "index.json", { cache: "no-store" });
    if (r.ok) { const j = await r.json(), a = Array.isArray(j) ? j : j && j.files; if (Array.isArray(a) && a.every(x => typeof x === "string")) return a.map(p => p.startsWith(D) ? p : D + p.replace(/^\.?\//, "")).filter(isJSON); }
  } catch {}
  const repo = ghRepo();
  if (repo) for (const br of [...new Set([CFG.branch, "HEAD", "main", "master"].filter(Boolean))]) {
    try {
      const r = await fetch(`https://api.github.com/repos/${repo}/git/trees/${br}?recursive=1`); if (!r.ok) continue;
      const L = ((await r.json()).tree || []).filter(t => t.type === "blob" && t.path.startsWith(D) && isJSON(t.path) && (t.size || 0) < CFG.maxBytes).map(t => t.path);
      if (L.length) { CFG.branch = br; return L; }
    } catch {}
  }
  const out = [];
  async function walk(dir, depth) {
    if (depth > 5 || out.length >= CFG.max) return;
    let h, base = new URL(dir, location.href);
    try { const r = await fetch(dir, { cache: "no-store" }); if (!r.ok || !/html/.test(r.headers.get("content-type") || "")) return; h = await r.text(); } catch { return; }
    for (const m of h.matchAll(/href="([^"#?]+)"/g)) {
      let u; try { u = new URL(m[1], base); } catch { continue; }
      if (u.origin !== base.origin || !u.pathname.startsWith(base.pathname) || u.pathname === base.pathname) continue;
      const rel = decodeURIComponent(u.pathname.slice(base.pathname.length));
      if (rel.endsWith("/")) await walk(dir + rel, depth + 1); else if (isJSON(rel)) out.push(dir + rel);
    }
  }
  await walk(D, 0); return out;
}
async function fetchData(p) {
  const get = async u => { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw 0; return r.text(); };
  try { return await get(enc(p)); } catch { const repo = ghRepo(); if (!repo) throw 0; return get(`https://raw.githubusercontent.com/${repo}/${CFG.branch || "HEAD"}/${enc(p)}`); }
}
async function loadData() {
  const paths = [...new Set(await listData())].sort().slice(0, CFG.max), files = [];
  await Promise.all(paths.map(async p => {
    try { const es = toEntries(JSON.parse((await fetchData(p)).replace(/^\uFEFF/, ""))); if (es.length) files.push([p, { topic: p.split("/")[1] || "", entries: es }]); } catch {}
  }));
  return { paths: paths.length, files: files.sort((a, b) => a[0] < b[0] ? -1 : 1) };
}
const dataMsg = D => D.files.length ? `data 폴더에서 JSON ${D.files.length}개를 읽었어.` : D.paths ? `data 폴더에서 JSON ${D.paths}개를 찾았지만 지식 형식이 아니라서 건너뛰었어.` : "";

function refresh() {
  bot = new Bot(BRAIN, model); if (model && !bot.fast) model = null;
  const n = Object.keys(BRAIN).length, nd = Object.keys(BRAIN).filter(k => k.startsWith(CFG.dir + "/")).length;
  const st = !model ? "모델 없음 · 검색으로만 답해요" : bot.stale ? "brain이 바뀌었어요 · 재학습 권장(새 지식은 검색으로 먼저 답해요)" : `파라미터 ${model.params.toLocaleString()}개 · loss ${model.loss.toFixed(3)}`;
  $("stat").textContent = `📚 파일 ${n}개(data ${nd}개) · 지식 ${bot.P.ans.length - 1}개 · ${st}`;
  $("q").disabled = false; $("exp").disabled = !model;
}

const GREET = ["안녕? 내 이름은 바레아야\n궁금한거나 모르는거 물어봐줘!", "안녕? 내 이름 바레아\n바게루 래피드 아카리우스!", "안녕?", "무엇을 재미있게 요리해볼레?", "안녕 난 바레아", "안녕 만나서 반가워 난 바레아!!!", "오늘은 무엇을 대화할까요?"];
const SAMPLES = ["97은 소수야?", "(12+8)×3÷4", "비가 오면 땅이 젖는다. 비가 온다. 땅이 젖을까?"];
const ABOUT = "나는 바레아(BAREA)야! 🍞\nBAGERU RAPID ACARIUS의 줄임말이고, 바게르탄의 정체성을 가진 이 게임의 AI야.\n\n· Bageru: 바게르탄의 정체성, 게임의 정체성을 담은 AI\n· Rapid: 빠른 처리와 신속한 사고\n· Acarius: 번트브레드의 이름에서 가져온 철학적 계승 (게임 속 이야기)\n\n궁금한 건 뭐든 물어봐줘!";
function identity(q) {
  const n = q.toLowerCase().replace(/[\s?!.~,]/g, "");
  return /^(너는|넌|너|당신은|당신|니가|네가)?(누구(야|니|세요|예요|에요|냐|임|인가요|죠)?|누군데|누군가요)$/.test(n)
    || /(바레아|barea)(는|가|란|이|의)?(누구|뭐|무엇|뭔|정체|소개|뜻|의미|이름|유래)/.test(n)
    || /(너|넌|네|니|당신|ai|에이아이)(의|는|가)?(이름|정체|소개)(이|은|가)?(뭐|무엇|뭔|알려|말해)?/.test(n)
    || /^(자기소개|소개해|너소개|이름이뭐야|이름뭐야|이름이뭐니|whoareyou|yourname)/.test(n)
    || /(이름).*(뜻|의미|유래)/.test(n);
}
async function ask(q) {
  q = q.trim(); if (!q || busy || !bot) return; busy = true; bubble("u", q);
  const t0 = performance.now(), id = identity(q), t = id ? null : tools(q); let text, meta, sug;
  if (id) { text = ABOUT; sug = SAMPLES; meta = "바레아 소개"; }
  else if (t) {
    text = t.a; sug = t.chips; meta = `도구: ${t.src} · ${(performance.now() - t0).toFixed(1)}ms`;
    if (t.src === "추론" && freeGen && mode !== "tool") {
      const g = freeGen(q), exact = g.text === t.a, vOk = headKind(g.text) === headKind(t.a), same = vOk && lastLine(g.text) === lastLine(t.a);
      score.n++; if (same) score.ok++; if (vOk) score.v++; if (exact) score.ex++;
      const tag = exact ? "도구와 완전 일치" : same ? "결론까지 일치(근거 줄 표현만 다름)" : vOk ? "판정만 일치(내용은 다름)" : "도구와 다름";
      meta = `신경망 자유 생성 ${g.n}토큰 · ${g.ms.toFixed(0)}ms · ${tag} · 누적 결론까지 일치 ${score.ok}/${score.n} (판정만 맞은 것 포함 ${score.v}/${score.n}, 완전 ${score.ex})`;
      text = mode === "nn" ? (g.text || "(신경망이 빈 답을 냈어)") : `신경망:\n${g.text || "(빈 답)"}\n\n도구(정확):\n${t.a}`;
      sug = null;
    }
  }
  else {
    const o = bot.reply(q); text = o.text; sug = o.unk ? o.sug : null;
    meta = o.n ? `신경망 ${o.n}토큰 · LM ${o.lm == null ? "-" : Math.round(o.lm * 100) + "%"} · 검색 ${Math.round(o.ret * 100)}% · ${o.ms.toFixed(1)}ms` : `검색 · ${o.ms.toFixed(1)}ms`;
  }
  const el = bubble("b", ""), sp = el.firstChild, step = Math.max(1, Math.ceil(text.length / 40));
  for (let i = 0; i < text.length; i += step) { sp.textContent = text.slice(0, i + step); chat.scrollTop = chat.scrollHeight; await sleep(10); }
  sp.textContent = text;
  const m = document.createElement("span"); m.className = "meta"; m.textContent = meta; el.appendChild(m);
  chips(el, sug); chat.scrollTop = chat.scrollHeight; busy = false;
}
$("f").addEventListener("submit", e => { e.preventDefault(); if (busy) return; const v = $("q").value; $("q").value = ""; ask(v); });

async function ensureTF() {
  if (!window.tf) await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  LMKit.setTF(window.tf);
}
$("train").onclick = async () => {
  if (busy) return; busy = true; $("train").disabled = true;
  try {
    $("stat").textContent = "학습 엔진(tf.js) 불러오는 중…"; await ensureTF();
    const steps = +$("steps").value, t0 = Date.now(); $("bar").max = steps;
    model = await fit(BRAIN, { steps }, (s, n, l) => { $("bar").value = s; $("stat").textContent = `🔥 학습 중 ${s}/${n} · loss ${l.toFixed(3)} · ${((Date.now() - t0) / 1000) | 0}초`; });
    refresh(); $("adm").classList.remove("on");
    bubble("b", `학습 끝! loss ${model.loss.toFixed(3)}. 이제 신경망이 직접 답해. 계속 쓰려면 ‘model.json 내보내기’로 저장해서 사이트에 올려줘.`);
  } catch (e) { console.error(e); bubble("b", "학습에 실패했어. 네트워크(tf.js 불러오기)를 확인해줘."); refresh(); }
  busy = false; $("train").disabled = false;
};
$("exp").onclick = () => { if (!model) return; const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(model)], { type: "application/json" })); a.download = "model.json"; a.click(); };

async function loadFiles(list, replace) {
  const next = replace ? {} : { ...BRAIN }; let ok = 0;
  const add = (k, d) => { const es = toEntries(d); if (es.length) { next[k] = { entries: es }; ok++; } };
  for (const f of list) { if (!/\.json$/i.test(f.name)) continue; try { add(f.webkitRelativePath || "brain/" + f.name, JSON.parse((await f.text()).replace(/^\uFEFF/, ""))); } catch {} }
  $("adm").classList.remove("on");
  if (ok) { BRAIN = next; refresh(); bubble("b", `JSON ${ok}개를 읽었어. 검색으로는 바로 답할 수 있고, 신경망까지 반영하려면 ‘브라우저에서 학습’을 눌러줘.`); }
  else bubble("b", "읽을 수 있는 JSON이 없어.");
}
$("dir").onclick = () => $("dirIn").click(); $("files").onclick = () => $("fileIn").click();
$("dirIn").onchange = e => { loadFiles([...e.target.files], false); e.target.value = ""; };
$("fileIn").onchange = e => { loadFiles([...e.target.files], false); e.target.value = ""; };
$("reload").onclick = async () => {
  if (busy) return; busy = true; $("adm").classList.remove("on"); $("stat").textContent = "data 폴더 읽는 중…";
  const D = await loadData().catch(() => ({ paths: 0, files: [] }));
  for (const k of Object.keys(BRAIN)) if (k.startsWith(CFG.dir + "/")) delete BRAIN[k];
  for (const [k, v] of D.files) BRAIN[k] = v;
  refresh(); bubble("b", (dataMsg(D) || "data 폴더에서 읽을 JSON을 못 찾았어.") + (D.files.length ? " 신경망까지 반영하려면 ‘브라우저에서 학습’을 눌러줘." : "")); busy = false;
};
$("clr").onclick = () => { for (const k of Object.keys(mem)) delete mem[k]; LMKit.onMem(mem); $("adm").classList.remove("on"); bubble("b", "기억(이름·가르친 문장)을 지웠어."); };

(async () => {
  try { BRAIN = await getJSON("brain.json"); } catch { BRAIN = {}; }
  try { model = await getJSON("model.json"); } catch { model = null; }
  try { let o; try { o = await getJSON("train_data/model_free.json"); } catch { o = await getJSON("model_free.json"); } if (o && o.kind === "free-v1") { freeGen = makeFree(o); free = o; } } catch { free = null; freeGen = null; }
  let m = "tool";
  if (free) {
    const np = free.lm.w.reduce((a, x) => a + x.length, 0); try { m = localStorage.getItem("tl-mode") || "tool"; } catch {}
    $("freeStat").textContent = `🧠 자유 생성 모델 ${np.toLocaleString()}개 · ${free.steps}step · loss ${(+free.loss).toFixed(3)}`;
  }
  setMode(m);
  $("stat").textContent = "data 폴더 읽는 중…";
  let D = { paths: 0, files: [] }; try { D = await loadData(); } catch {}
  for (const [k, v] of D.files) BRAIN[k] = v;
  refresh();
  const info = dataMsg(D) ? "\n\n" + dataMsg(D) + (!model || bot.stale ? " 신경망에도 반영하려면 ☰ → ‘브라우저에서 학습’을 눌러줘." : "") : "";
  const hi = GREET[Math.floor(Math.random() * GREET.length)];
  chips(bubble("b", hi + (model ? "" : "\n\n(model.json이 없어서 지금은 검색으로만 답해. ☰ 메뉴에서 학습시켜줘.)") + info), ["소수가 뭐야", "97은 소수야?", "(12+8)×3÷4", "고양이는 동물이다. 동물은 생물이다. 고양이는 생물일까?", "영희보다 철수가 크다. 민수보다 영희가 크다. 누가 제일 커?", "새는 날 수 있다. 펭귄은 새다. 펭귄은 날 수 없다. 펭귄은 날 수 있어?", "비가 오면 땅이 젖는다. 비가 온다. 땅이 젖을까?"]);
})();
