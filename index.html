<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reiba</title>
<style>
  :root {
    --bg: #f4eee1;
    --ink: #2d2a22;
    --muted: #7a705a;
    --accent: #e8b923;
    --accent-hover: #d9a90f;
    --line: #dccfae;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.6;
    display: flex;
    align-items: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  main { width: 100%; max-width: 440px; margin: 0 auto; }
  h1 {
    font-size: clamp(2.6rem, 14vw, 4.2rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin: 0 0 20px;
    font-weight: 800;
  }
  p { margin: 0 0 14px; color: var(--muted); max-width: 34em; }
  a.open {
    display: block;
    margin: 28px 0 24px;
    padding: 18px 20px;
    background: var(--accent);
    color: var(--ink);
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    border-radius: 12px;
  }
  a.open:hover { background: var(--accent-hover); }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .note { border-top: 1px solid var(--line); padding-top: 16px; font-size: 0.92rem; }
  .note a { color: #8a6200; }
</style>
</head>
<body>
<main>
  <h1>Reiba</h1>
  <p>직접 학습시킨 모델과 바로 대화할 수 있어요.</p>
  <a class="open" href="https://uzgm-reiba.hf.space">채팅 열기</a>
  <div class="note">
    <p>처음 열 때는 서버를 깨우느라 1~2분 걸릴 수 있어요.</p>
    <p>Hugging Face 계정이 있다면 로그인한 뒤 <a href="https://huggingface.co/spaces/Uzgm/reiba">이 주소</a>로 열어 보세요. 계정별 사용 한도가 따로 적용돼요.</p>
  </div>
</main>
</body>
</html>
